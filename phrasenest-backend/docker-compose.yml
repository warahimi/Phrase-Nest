services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: phrasenest-postgres
    environment:
      POSTGRES_DB: phrasenest
      POSTGRES_USER: phrasenest
      POSTGRES_PASSWORD: phrasenest
    ports:
      - "5432:5432"
    volumes:
      - phrasenest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phrasenest -d phrasenest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  phrasenest_postgres_data:
