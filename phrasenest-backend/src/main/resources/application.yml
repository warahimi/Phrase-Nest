
spring:
  application:
    name: phrasenest-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/phrasenest}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

info:
  app:
    name: PhraseNest
    description: Learn idioms, phrases, phrasal verbs, and common expressions.
    version: 0.0.1


  security:
    user:
      name: admin
      password: local-admin-password
      roles:
        - ADMIN

